name: Tag release

# Tags `v<version>` whenever a changed `__version__` lands on main, so downstream projects can pin a version.

on:
  push:
    branches:
      - main
    paths:
      - src/mr_deed/__init__.py

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the version tag if it does not exist yet
        run: |
          version=$(grep -oP '^__version__\s*=\s*"\K[^"]+' src/mr_deed/__init__.py)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists"
            exit 0
          fi
          git tag "v$version"
          git push origin "v$version"
